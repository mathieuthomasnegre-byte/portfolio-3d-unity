<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Le navigateur ne peut contacter que cette appli et les serveurs Azure Speech. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:; connect-src 'self' https://*.tts.speech.microsoft.com https://*.stt.speech.microsoft.com"
    />
    <title>Ahla – le libanais à voix haute</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Jeu d'icônes, utilisé par icon() dans js/app.js -->
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor" /></symbol>
      <symbol id="i-slow" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2" /><path d="M12 7.5V12l-3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" /><path d="M6 11a6 6 0 0 0 12 0M12 17v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" /></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.5c.5 3.5 5.5 5.5 5.5 11a5.5 5.5 0 0 1-11 0c0-2 .8-3.3 1.8-4.3.3 1.5 1 2.3 1.9 2.6C10 8.5 10.5 5 12 2.5z" fill="currentColor" /></symbol>
      <symbol id="i-logo" viewBox="0 0 64 64"><path d="M10 50V28a22 22 0 0 1 44 0v22H26l-9 8v-8z" fill="currentColor" /><path d="M22 34v6M29 28v18M36 31v12M43 35v4" stroke="var(--bg)" stroke-width="4" stroke-linecap="round" /></symbol>
    </svg>
    <main id="app"></main>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
